name: Python smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pandoc ghostscript fonts-dejavu-core xvfb python3-tk libpango-1.0-0 libcairo2 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Tests under virtual X11
        run: xvfb-run -a python -m pytest -q
